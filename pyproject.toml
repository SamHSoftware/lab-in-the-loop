[tool.poetry]
name = "lab-in-the-loop"
version = "0.1.0"
description = "Lab in the loop demo: a tiny NumPy surrogate model, run in the browser with Pyodide, which optimises compound concentrations against a fictitious lab."
readme = "README.md"
license = "MIT"
authors = ["Sam Huguet <samhuguet1@gmail.com>"]

[tool.poetry.dependencies]
python = "3.12.13"
# Same NumPy version as the Pyodide release in web/worker.js.
numpy = "2.4.6"

[tool.poetry.group.dev.dependencies]
black = ">=25.1.0,<26.0.0"
isort = ">=6.0.1,<7.0.0"
flake8 = ">=7.3.0,<8.0.0"
pytest = ">=8.4.2,<9.0.0"
mypy = ">=1.18.1,<2.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
pre-commit = ">=4.3.0,<5.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
